[project]
name = "whatsapp-mcp-server"
version = "0.2.0"
description = "Model Context Protocol server for searching, reading and sending your personal WhatsApp messages"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<1",
    # mcp 2.x removed the FastMCP API this server is built on.
    "mcp[cli]>=1.30.0,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL"]
ignore = [
    "PLR0913", # MCP tools legitimately take many optional filters
    "PLR0917",
    "PLR2004", # magic values are fine in this small codebase
    "S608",    # SQL is built from fixed fragments; all values are bound parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PLR0915", "E501"]
"audio.py" = ["S603", "S607"] # ffmpeg is invoked with a fixed argument list

[tool.mypy]
python_version = "3.11"
strict = true
files = ["main.py", "whatsapp.py", "audio.py", "config.py", "doctor.py"]
